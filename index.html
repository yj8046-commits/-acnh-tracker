<script>

  [...$('#monthSeg').children].forEach(b=>b.classList.toggle('active',b.dataset.h===hemi));updateProfile();$('#onboard').hidden=true;render();

$('#month').onchange=render; $('#search').oninput=render;

async function loadOne(k){try{let cached=localStorage.getItem('acnh-data-'+k); if(cached){db[k]=JSON.parse(cached);return} const r=await fetch(URLS[k]); if(!r.ok) throw 0; db[k]=await r.json(); try{localStorage.setItem('acnh-data-'+k,JSON.stringify(db[k]))}catch{} }catch{db[k]=null}}

function monthsFor(x){return x.availability?.[`month-array-${hemi==='south'?'southern':'northern'}`]||[]}
function timeFor(x){return x.availability?.['time-array']||[]}
function availableMonth(x,m){return monthsFor(x).includes(+m)}
function availableNow(x,m){return availableMonth(x,m)&&timeFor(x).includes(hourNow)}
function lastMonth(x,m){const ms=monthsFor(x); if(!ms.includes(+m)||ms.length===12)return false; const next=(+m%12)+1; return !ms.includes(next)}

function hlabel(h){h=(h+24)%24;if(h===0)return '자정 12시';if(h===12)return '낮 12시';if(h<12)return `오전 ${h}시`;return `오후 ${h-12}시`}
function fmtTime(x){const a=[...new Set(timeFor(x))].sort((a,b)=>a-b);if(!a.length||a.length===24)return '하루 종일';const set=new Set(a),starts=[];for(let h=0;h<24;h++)if(set.has(h)&&!set.has((h+23)%24))starts.push(h);if(!starts.length)return '하루 종일';const ranges=[];for(const s of starts){let e=s;while(set.has(e%24)){e++;if(e-s>24)break}ranges.push(`${hlabel(s)}~${hlabel(e%24)}`)}return ranges.join(' · ')}

function currentItems(){const type=activeType(),m=+$('#month').value,q=$('#search').value.trim().toLowerCase();let xs=normalized(type);xs=xs.filter(x=>{const d=x._type==='gyroid'?gyroidComplete(x):isDone(x._type,x.id);if(q&&!ko(x).toLowerCase().includes(q)&&!(x['file-name']||'').includes(q))return false;if(['art','gyroid'].includes(x._type))return view==='done'?d:true;if(view==='month')return availableMonth(x,m);if(view==='monthleft')return availableMonth(x,m)&&!d;if(view==='now')return availableNow(x,m);if(view==='last')return lastMonth(x,m);if(view==='done')return d;return true});return xs.sort((a,b)=>a.id-b.id)}
function renderSummary(){const type=activeType(),m=+$('#month').value;if(type==='art'){const total=arr(db.art).length,done=arr(db.art).filter(x=>isDone('art',x.id)).length;$('#summary').innerHTML=`<div class="stat"><span>🖼️ 전체 미술품</span><b>${total||'-'}</b><span>종</span></div><div class="stat"><span>✅ 수집 완료</span><b>${done}</b><span>종</span></div><div class="stat"><span>⬜ 미수집</span><b>${Math.max(0,total-done)}</b><span>종</span></div><div class="stat"><span>📌 현재 보기</span><b>${currentItems().length}</b><span>종</span></div>`;return}if(type==='gyroid'){const total=GYROIDS.length,done=GYROIDS.filter(gyroidComplete).length,totalColors=GYROIDS.reduce((n,x)=>n+x.colors.length,0),ownedColors=GYROIDS.reduce((n,x)=>n+gyroidOwnedCount(x),0);$('#summary').innerHTML=`<div class="stat"><span>🗿 토용 종류</span><b>${done}/${total}</b><span>전컬러 완료</span></div><div class="stat"><span>🎨 전체 컬러</span><b>${ownedColors}/${totalColors}</b><span>소장</span></div><div class="stat"><span>⬜ 남은 컬러</span><b>${totalColors-ownedColors}</b><span>개</span></div><div class="stat"><span>📌 현재 보기</span><b>${currentItems().length}</b><span>종</span></div>`;return}
const all=normalized(type),month=all.filter(x=>availableMonth(x,m)),left=month.filter(x=>!isDone(type,x.id)),now=month.filter(x=>availableNow(x,m));$('#summary').innerHTML=`<div class="stat"><span>📚 전체 도감</span><b>${all.length}</b><span>종</span></div><div class="stat"><span>🌼 ${m}월 출현</span><b>${month.length}</b><span>종</span></div><div class="stat"><span>⬜ ${m}월 미수집</span><b>${left.length}</b><span>종</span></div><div class="stat"><span>⏰ 지금 잡힘</span><b>${now.length}</b><span>종</span></div>`}
function render(){const monthViews=['month','monthleft','now','last'];const type=activeType();const isCollect=tab==='collect';$('#collectseg').hidden=!isCollect;[...$('#viewtabs').children].forEach(b=>{const disabled=isCollect&&monthViews.includes(b.dataset.view);b.disabled=disabled;b.style.opacity=disabled?'.35':'1'});const titles={fish:'물고기',bugs:'곤충',sea:'해산물',art:'미술품',gyroid:'토용'};$('#sectionTitle').textContent=titles[type];$('#notice').textContent=isCollect?(collect==='art'?'미술품은 진품·가품 사진을 나란히 비교하고 수집 체크할 수 있어.':'토용 36종 · 189개 컬러를 실제 게임 이미지로 비교하면서 각각 체크해.'):'노란색 = 이번 달 출현(수집 여부 무관) · 분홍색 = 이번 달 출현 + 아직 미수집'; if(!db.fish||!db.bugs||!db.sea||!db.art){$('#list').innerHTML='<div class="empty">데이터를 불러오지 못했어.<br>인터넷 연결 후 새로고침해줘.</div>';return}renderSummary();const xs=currentItems(),m=+$('#month').value;$('#count').textContent=`${xs.length}개`;if(!xs.length){$('#list').innerHTML='<div class="empty">조건에 맞는 항목이 없어 🎉</div>';return}
$('#list').innerHTML=xs.map(x=>{const d=x._type==='gyroid'?gyroidComplete(x):isDone(x._type,x.id),im=icon(x),mon=x._type!=='art'&&x._type!=='gyroid'&&availableMonth(x,m),left=mon&&!d;let meta='',badges='';if(x._type==='art'){meta=`${artType(x)} · ${x.hasFake?'가품 있음':'항상 진품'}`;badges=x.hasFake?'<span class="badge last">가품 주의</span>':'<span class="badge now">항상 진품</span>'}else if(x._type==='gyroid'){const owned=gyroidOwnedCount(x);meta=x.name['name-KRko']==='마스터 토용'?'마스터에게 커피를 50잔 구매한 뒤 받을 수 있는 특별 토용 · 컬러 리폼 없음':'토용 조각을 심고 물을 준 뒤 다음 날 발굴 · 리폼 키트 1개 또는 파니의 섬 리사&리포로 컬러 변경 가능';badges=d?'<span class="badge now">전컬러 완료</span>':`<span class="badge month">${owned}/${x.colors.length} 컬러</span>`}else{const sz=sizeInfo(x,x._type);meta=`<strong>시간</strong> ${fmtTime(x)}<br><strong>장소</strong> ${x._type==='sea'?'바다 잠수':loc(x)}`+(sz?` · <strong>크기</strong> ${sz}`:'')+(x._type==='sea'?` · <strong>속도</strong> ${SPD[x.speed]||x.speed||'—'}`:'');if(mon)badges+=`<span class="badge month">${m}월 출현</span>`;if(left)badges+='<span class="badge missing">미수집</span>';if(availableNow(x,m))badges+='<span class="badge now">지금 출현</span>';if(lastMonth(x,m))badges+='<span class="badge last">이번 달 마지막</span>';if(d)badges+='<span class="badge done">수집 완료</span>'}
const strip=['art','gyroid'].includes(x._type)?'':`<div class="monthstrip">${Array.from({length:12},(_,i)=>`<span class="mcell ${monthsFor(x).includes(i+1)?'on':''} ${i+1===m?'sel':''}" title="${i+1}월"></span>`).join('')}</div>`;
const visual=x._type==='gyroid'?`<img class="icon" src="${gyImg(x,x.colors[0])}" alt="${ko(x)}" onerror="this.outerHTML='<div class=&quot;icon gyroidIcon&quot;>🗿</div>'">`:x._type==='art'?`<img class="icon" src="${im}" alt="${ko(x)}" onerror="this.outerHTML='<div class=&quot;icon gyroidIcon&quot;>?</div>'">`:'';
const ai=x._type==='art'?artImages(x):[];
const artCompare=x._type==='art'?`<div class="art-compare ${x.hasFake?'':'art-single'}"><div class="art-shot real"><img loading="lazy" src="${ai[0]||im}" alt="${ko(x)} 진품"><b>✓ 진품</b></div>${x.hasFake?`<div class="art-shot fake"><img loading="lazy" src="${ai[1]||''}" alt="${ko(x)} 가품"><b>✕ 가품</b></div>`:''}</div>`:'';
const tipbox=x._type==='art'?`<div class="artTip"><strong>${x.hasFake?'🔎 구별 포인트':'✅ 가품 없음'}</strong><br>${artTip(x)}</div>`:'';
const variants=x._type==='gyroid'?`<div class="variantCount">🎨 ${gyroidOwnedCount(x)} / ${x.colors.length} 컬러 소장 · 이미지를 눌러 체크</div><div class="variants">${x.colors.map(c=>`<button class="variant ${gyOwned(x.id,c)?'owned':''}" data-gid="${x.id}" data-color="${c}"><img loading="lazy" src="${gyImg(x,c)}" alt="${ko(x)} ${c}" onerror="this.style.opacity='.15'"><span class="vname">${gyOwned(x.id,c)?'✓ ':''}${c}</span></button>`).join('')}</div><button class="allColors ${d?'complete':''}" data-gall="${x.id}">${d?'✓ 전컬러 소장 완료':'이 토용 전컬러 한 번에 체크'}</button>`:'';
const cls=(x._type==='gyroid'?'gyroid-card ':x._type==='art'?'art-card ':'critter-card ')+(['art','gyroid'].includes(x._type)?'':(mon?'month':'offmonth'));
const action=x._type==='gyroid'?'':`<button class="check ${d?'done':''}" data-t="${x._type}" data-id="${x.id}">${d?'✓':'○'}</button>`;
return x._type==='art'?`<div class="item ${cls}"><div class="art-main"><div class="name">${ko(x)}</div><div class="meta">${meta}</div><div class="badges">${badges}</div>${artCompare}${tipbox}</div>${action}</div>`:`<div class="item ${cls} ${left?'left':''}">${visual}<div><div class="name">${ko(x)}</div><div class="meta">${meta}</div><div class="badges">${badges}</div>${strip}${tipbox}${variants}</div>${action}</div>`}).join('')}
$('#list').onclick=e=>{const v=e.target.closest('.variant');if(v){toggleGyroidColor(v.dataset.gid,v.dataset.color);return}const all=e.target.closest('.allColors');if(all){toggleGyroidAll(all.dataset.gall);return}const b=e.target.closest('.check');if(b)toggle(b.dataset.t,b.dataset.id)}
$('#backup').onclick=()=>{const blob=new Blob([JSON.stringify({state,hemi,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='acnh-tracker-backup.json';a.click();URL.revokeObjectURL(a.href)};
$('#restore').onclick=()=>$('#restoreFile').click();$('#restoreFile').onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());if(j.state?.done){localStorage.setItem('acnh-state-v1',JSON.stringify(j.state));location.reload()}}catch{alert('백업 파일을 읽지 못했어.')}};
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
